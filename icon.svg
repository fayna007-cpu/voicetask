<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5b3fb8"/>
      <stop offset="55%" stop-color="#7c4dd6"/>
      <stop offset="100%" stop-color="#a667ff"/>
    </linearGradient>
    <radialGradient id="orb" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#e9def6"/>
      <stop offset="100%" stop-color="#b89aef"/>
    </radialGradient>
    <radialGradient id="shine" cx="34%" cy="24%" r="38%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".85"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a667ff" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#5b3fb8" stop-opacity="0"/>
    </radialGradient>
    <filter id="softblur"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <!-- App background -->
  <rect width="512" height="512" rx="115" fill="url(#bg)"/>

  <!-- Outer aura -->
  <circle cx="256" cy="260" r="220" fill="url(#glow)" filter="url(#softblur)"/>

  <!-- Orb body -->
  <circle cx="256" cy="252" r="148" fill="url(#orb)"/>

  <!-- Top-left specular highlight -->
  <ellipse cx="216" cy="208" rx="64" ry="44" fill="url(#shine)"/>

  <!-- Eyes -->
  <ellipse cx="220" cy="254" rx="11" ry="22" fill="#1a1029"/>
  <ellipse cx="292" cy="254" rx="11" ry="22" fill="#1a1029"/>

  <!-- Subtle smile -->
  <path d="M226 296 Q256 320 286 296"
        fill="none" stroke="#1a1029" stroke-width="6"
        stroke-linecap="round" opacity=".55"/>

  <!-- Soft cheeks -->
  <circle cx="190" cy="288" r="14" fill="#d8a3ff" opacity=".35"/>
  <circle cx="322" cy="288" r="14" fill="#d8a3ff" opacity=".35"/>

  <!-- Bottom amber accent dot (signature) -->
  <circle cx="256" cy="430" r="9" fill="#f5b94a"/>
  <circle cx="256" cy="430" r="9" fill="#fbe09a" opacity=".6"/>
</svg>
